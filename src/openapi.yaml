openapi: 3.0.3
info:
  title: Docker Admin API
  version: '1.0.0'
  description: Protocol-compliant API for Docker resource management
servers:
  - url: /api
paths:
  /containers:
    get:
      summary: List containers
      responses:
        '200':
          description: List of containers
    post:
      summary: Create a container
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Container created
  /containers/{id}:
    get:
      summary: Inspect a container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Container details
    delete:
      summary: Remove a container
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Container removed
